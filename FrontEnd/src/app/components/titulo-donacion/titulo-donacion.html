<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 pb-2">

  <!-- Bloque izquierdo: Etiquetas, Título y Subtítulo -->
  <div>
    <!-- Fila superior: Texto ámbar + Badge celeste -->
    <div class="d-flex align-items-center gap-2 mb-2">
      <span class="texto-ambar fw-bold text-uppercase small" style="letter-spacing: 0.6px;">
        Área de Recepción &amp; Almacén
      </span>
      <span class="badge badge-formulario rounded-2 px-2 py-1 fw-semibold">
        Formulario Oficial
      </span>
    </div>

    <!-- Título principal -->
    <h1 class="fw-bold texto-azul-oscuro mb-1">Registro de Ingreso de Donativos</h1>

    <!-- Subtítulo descriptivo -->
    <p class="text-secondary mb-0">
      Ingresa los datos del donante, clasifica los víveres por categoría y genera el código de trazabilidad para el
      lote.
    </p>
  </div>

  <!-- Bloque derecho: Botón "Limpiar Campos" -->
  <div>
    <button type="button"
      class="btn btn-limpiar bg-white rounded-3 px-3 py-2 fw-semibold d-flex align-items-center gap-2 shadow-sm"
      (click)="limpiar()">
      <i class="bi bi-arrow-counterclockwise text-secondary"></i>
      <span>Limpiar Campos</span>
    </button>
  </div>

</div>

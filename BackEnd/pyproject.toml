[project]
name = "backend"
version = "0.1.0"
description = "API FastAPI del Gestor Solidario de Donativos y Alimentos"
readme = "README.md"
authors = [
    { name = "FabricioPahuacho1002", email = "61289952@continental.edu.pe" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "mysql-connector-python>=26.10.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
